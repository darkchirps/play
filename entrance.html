<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DL9998</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101116;
      --panel: #181b22;
      --panel-2: #20242d;
      --line: #303642;
      --text: #f4f7fb;
      --muted: #9aa5b5;
      --accent: #21d4a5;
      --accent-2: #ffcc66;
      --danger: #ff6b6b;
      --shadow: 0 18px 60px rgba(0, 0, 0, .35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(33, 212, 165, .18), transparent 30%),
        radial-gradient(circle at 100% 10%, rgba(255, 204, 102, .13), transparent 28%),
        linear-gradient(145deg, #0f1015 0%, #151821 48%, #111318 100%);
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: linear-gradient(135deg, #21d4a5, #2274ff);
      box-shadow: 0 10px 28px rgba(33, 212, 165, .18);
      font-size: 24px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1;
      letter-spacing: 0;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 8px;
      color: #dfe7f2;
      background: rgba(255, 255, 255, .04);
    }

    .hero {
      min-height: 312px;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr);
      gap: 28px;
      align-items: stretch;
      margin-bottom: 24px;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 0;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .hero h2 {
      margin: 12px 0 14px;
      max-width: 720px;
      font-size: clamp(40px, 7vw, 82px);
      line-height: .95;
      letter-spacing: 0;
    }

    .hero p {
      margin: 0;
      max-width: 620px;
      color: #c4cedb;
      font-size: 18px;
      line-height: 1.65;
    }

    .featured {
      min-height: 300px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: linear-gradient(150deg, rgba(33, 212, 165, .2), rgba(255, 204, 102, .12)), var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
    }

    .featured-art {
      position: absolute;
      inset: 0;
      opacity: .22;
      background:
        linear-gradient(90deg, transparent 0 18px, rgba(255, 255, 255, .12) 18px 20px) 0 0 / 46px 46px,
        linear-gradient(0deg, transparent 0 18px, rgba(255, 255, 255, .1) 18px 20px) 0 0 / 46px 46px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    .featured-icon {
      width: 96px;
      height: 96px;
      border-radius: 8px;
      object-fit: cover;
      background: rgba(0, 0, 0, .25);
      border: 1px solid rgba(255, 255, 255, .18);
      z-index: 1;
    }

    .featured h3,
    .featured p,
    .featured a {
      z-index: 1;
      position: relative;
    }

    .featured h3 {
      margin: 18px 0 8px;
      font-size: 28px;
      line-height: 1.1;
    }

    .featured p {
      margin: 0 0 18px;
      color: #d6deea;
      line-height: 1.55;
    }

    .play-link {
      width: max-content;
      max-width: 100%;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      border-radius: 8px;
      color: #08100d;
      background: var(--accent);
      font-weight: 800;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin: 20px 0;
    }

    .search {
      height: 46px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      outline: none;
      padding: 0 16px;
      color: var(--text);
      background: rgba(255, 255, 255, .06);
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .filter {
      min-height: 38px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      padding: 0 13px;
      color: #d6deea;
      background: rgba(255, 255, 255, .05);
      cursor: pointer;
    }

    .filter.active {
      color: #101116;
      border-color: var(--accent-2);
      background: var(--accent-2);
      font-weight: 800;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 24px 0 14px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .count {
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
    }

    .card {
      min-height: 254px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 8px;
      background: rgba(24, 27, 34, .84);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .18);
      overflow: hidden;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(33, 212, 165, .55);
      background: rgba(32, 36, 45, .95);
    }

    .card-media {
      height: 136px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, 0)),
        var(--panel-2);
    }

    .card-media img {
      width: 84px;
      height: 84px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(0, 0, 0, .22);
    }

    .card-body {
      padding: 14px;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .tag {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rating {
      color: var(--accent-2);
      font-weight: 800;
      white-space: nowrap;
    }

    .card h3 {
      margin: 0 0 12px;
      min-height: 44px;
      font-size: 18px;
      line-height: 1.22;
      overflow-wrap: anywhere;
    }

    .card .play-link {
      width: 100%;
      min-height: 38px;
      font-size: 14px;
    }

    .empty {
      display: none;
      padding: 28px;
      border: 1px dashed rgba(255, 255, 255, .16);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 255, 255, .04);
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 22px, 1180px);
        padding-top: 18px;
      }

      .topbar,
      .section-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav,
      .filters {
        justify-content: flex-start;
      }

      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .hero h2 {
        font-size: clamp(38px, 16vw, 58px);
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .featured {
        min-height: 260px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">G</div>
        <div>
          <h1>DL9998</h1>
          <p>DL9998游戏平台</p>
        </div>
      </div>
      <nav class="nav" aria-label="主导航">
        <!-- <a href="#games">游戏库</a>
        <a href="#featured">推荐</a> -->
      </nav>
    </header>

    <section class="hero" id="featured">
      <div class="hero-copy">
        <div class="eyebrow">daily recommendation</div>
        <h2>今日推荐</h2>
      </div>
      <article class="featured" id="featuredCard">
        <div class="featured-art" aria-hidden="true"></div>
      </article>
    </section>

    <section id="games" aria-labelledby="gamesTitle">
      <div class="toolbar">
        <input class="search" id="searchInput" type="search" placeholder="搜索游戏名称或分类">
        <div class="filters" id="filters"></div>
      </div>

      <div class="section-head">
        <h2 id="gamesTitle">游戏库</h2>
        <div class="count" id="gameCount"></div>
      </div>

      <div class="grid" id="gameGrid"></div>
      <div class="empty" id="emptyState">没有找到匹配的游戏</div>
    </section>
  </main>

  <script src="./games-config.js"></script>
  <script>
    const games = Array.isArray(window.GAME_CONFIG) ? window.GAME_CONFIG : [];
    const grid = document.querySelector("#gameGrid");
    const filters = document.querySelector("#filters");
    const searchInput = document.querySelector("#searchInput");
    const gameCount = document.querySelector("#gameCount");
    const emptyState = document.querySelector("#emptyState");
    const featuredCard = document.querySelector("#featuredCard");
    let activeCategory = "全部";

    function uniqueCategories() {
      return ["全部", ...new Set(games.map((game) => game.category))];
    }

    function renderFeatured() {
      const featured = games.find((game) => game.featured) || games[0];
      if (!featured) {
        featuredCard.innerHTML = "";
        return;
      }

      featuredCard.innerHTML = `
        <div class="featured-art" aria-hidden="true"></div>
        <img class="featured-icon" src="${featured.icon}" alt="${featured.name}">
        <h3>${featured.name}</h3>
        <p>${featured.description || "马上开始游戏。"}</p>
        <a class="play-link" href="${featured.url}" target="_blank" rel="noopener">开始游戏</a>
      `;
    }

    function renderFilters() {
      filters.innerHTML = uniqueCategories().map((category) => `
        <button class="filter ${category === activeCategory ? "active" : ""}" type="button" data-category="${category}">
          ${category}
        </button>
      `).join("");
    }

    function getVisibleGames() {
      const keyword = searchInput.value.trim().toLowerCase();
      return games.filter((game) => {
        const matchesCategory = activeCategory === "全部" || game.category === activeCategory;
        const matchesKeyword = !keyword ||
          game.name.toLowerCase().includes(keyword) ||
          game.category.toLowerCase().includes(keyword);
        return matchesCategory && matchesKeyword;
      });
    }

    function renderGames() {
      const visibleGames = getVisibleGames();
      gameCount.textContent = `${visibleGames.length} / ${games.length} 款游戏`;
      emptyState.style.display = visibleGames.length ? "none" : "block";
      grid.innerHTML = visibleGames.map((game) => `
        <article class="card">
          <div class="card-media">
            <img src="${game.icon}" alt="${game.name}">
          </div>
          <div class="card-body">
            <div class="meta">
              <span class="tag">${game.category}</span>
              <span class="rating">★ ${game.rating || "4.5"}</span>
            </div>
            <h3>${game.name}</h3>
            <a class="play-link" href="${game.url}" target="_blank" rel="noopener">开始游戏</a>
          </div>
        </article>
      `).join("");
    }

    filters.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      activeCategory = button.dataset.category;
      renderFilters();
      renderGames();
    });

    searchInput.addEventListener("input", renderGames);

    renderFeatured();
    renderFilters();
    renderGames();
  </script>
</body>
</html>
