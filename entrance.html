<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DL9998</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101116;
      --panel: #181b22;
      --panel-2: #20242d;
      --line: #303642;
      --text: #f4f7fb;
      --muted: #9aa5b5;
      --accent: #21d4a5;
      --accent-2: #ffcc66;
      --danger: #ff6b6b;
      --shadow: 0 18px 60px rgba(0, 0, 0, .35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(33, 212, 165, .18), transparent 30%),
        radial-gradient(circle at 100% 10%, rgba(255, 204, 102, .13), transparent 28%),
        linear-gradient(145deg, #0f1015 0%, #151821 48%, #111318 100%);
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: linear-gradient(135deg, #21d4a5, #2274ff);
      box-shadow: 0 10px 28px rgba(33, 212, 165, .18);
      font-size: 24px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1;
      letter-spacing: 0;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 8px;
      color: #dfe7f2;
      background: rgba(255, 255, 255, .04);
    }

    .hero {
      min-height: 312px;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr);
      gap: 28px;
      align-items: stretch;
      margin-bottom: 24px;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 0;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .hero h2 {
      margin: 12px 0 14px;
      max-width: 720px;
      font-size: clamp(40px, 7vw, 82px);
      line-height: .95;
      letter-spacing: 0;
    }

    .hero p {
      margin: 0;
      max-width: 620px;
      color: #c4cedb;
      font-size: 18px;
      line-height: 1.65;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .featured {
      min-height: 300px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: linear-gradient(150deg, rgba(33, 212, 165, .2), rgba(255, 204, 102, .12)), var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
    }

    .featured-art {
      position: absolute;
      inset: 0;
      opacity: .22;
      background:
        linear-gradient(90deg, transparent 0 18px, rgba(255, 255, 255, .12) 18px 20px) 0 0 / 46px 46px,
        linear-gradient(0deg, transparent 0 18px, rgba(255, 255, 255, .1) 18px 20px) 0 0 / 46px 46px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    .featured-icon {
      width: 96px;
      height: 96px;
      border-radius: 8px;
      object-fit: cover;
      background: rgba(0, 0, 0, .25);
      border: 1px solid rgba(255, 255, 255, .18);
      z-index: 1;
    }

    .featured h3,
    .featured p,
    .featured a,
    .featured .recent-actions {
      z-index: 1;
      position: relative;
    }

    .featured h3 {
      margin: 18px 0 8px;
      font-size: 28px;
      line-height: 1.1;
    }

    .featured p {
      margin: 0 0 18px;
      color: #d6deea;
      line-height: 1.55;
    }

    .play-link {
      width: max-content;
      max-width: 100%;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      border-radius: 8px;
      color: #08100d;
      background: var(--accent);
      font-weight: 800;
    }

    .secondary-link {
      width: max-content;
      max-width: 100%;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      color: #dfe7f2;
      background: rgba(255, 255, 255, .06);
      font-weight: 800;
      cursor: pointer;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      color: #dfe7f2;
      background: rgba(255, 255, 255, .06);
      cursor: pointer;
    }

    .icon-button:hover,
    .icon-button:focus-visible,
    .secondary-link:hover,
    .secondary-link:focus-visible {
      outline: none;
      border-color: rgba(33, 212, 165, .48);
      background: rgba(255, 255, 255, .1);
    }

    .favorite-button.active {
      color: #101116;
      border-color: var(--accent-2);
      background: var(--accent-2);
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin: 20px 0;
    }

    .search {
      height: 46px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      outline: none;
      padding: 0 16px;
      color: var(--text);
      background: rgba(255, 255, 255, .06);
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .filter {
      min-height: 38px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      padding: 0 13px;
      color: #d6deea;
      background: rgba(255, 255, 255, .05);
      cursor: pointer;
    }

    .filter.active {
      color: #101116;
      border-color: var(--accent-2);
      background: var(--accent-2);
      font-weight: 800;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 24px 0 14px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .count {
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
    }

    .recent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }

    .recent-card {
      min-height: 112px;
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 8px;
      background: rgba(24, 27, 34, .72);
    }

    .recent-card img {
      width: 74px;
      height: 74px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(0, 0, 0, .22);
    }

    .recent-card h3 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .recent-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card {
      min-height: 254px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 8px;
      background: rgba(24, 27, 34, .84);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .18);
      overflow: hidden;
      position: relative;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(33, 212, 165, .55);
      background: rgba(32, 36, 45, .95);
    }

    .card-media {
      height: 136px;
      display: grid;
      place-items: center;
      position: relative;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, 0)),
        var(--panel-2);
    }

    .card .favorite-button {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(16, 17, 22, .78);
      backdrop-filter: blur(10px);
    }

    .card-media img {
      width: 84px;
      height: 84px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(0, 0, 0, .22);
    }

    .card-body {
      padding: 14px;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .tag {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rating {
      color: var(--accent-2);
      font-weight: 800;
      white-space: nowrap;
    }

    .card h3 {
      margin: 0 0 12px;
      min-height: 44px;
      font-size: 18px;
      line-height: 1.22;
      overflow-wrap: anywhere;
    }

    .card .play-link {
      width: 100%;
      min-height: 38px;
      font-size: 14px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 38px;
      gap: 8px;
      align-items: center;
    }

    .empty {
      display: none;
      padding: 28px;
      border: 1px dashed rgba(255, 255, 255, .16);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 255, 255, .04);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(5, 7, 10, .72);
      backdrop-filter: blur(10px);
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .modal {
      width: min(520px, 100%);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      background: #181b22;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-head {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) 38px;
      gap: 14px;
      align-items: center;
      padding: 16px;
      background: rgba(255, 255, 255, .04);
    }

    .modal-head img {
      width: 88px;
      height: 88px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(0, 0, 0, .22);
    }

    .modal-head h2 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .modal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .modal-body {
      padding: 16px;
    }

    .modal-body p {
      margin: 0 0 16px;
      color: #c4cedb;
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .load-notice {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 80;
      width: min(330px, calc(100% - 32px));
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      color: #dfe7f2;
      background: rgba(16, 17, 22, .94);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .42);
      backdrop-filter: blur(14px);
    }

    .load-notice[hidden] {
      display: none;
    }

    .load-notice h2 {
      margin: 0 0 6px;
      color: var(--accent-2);
      font-size: 15px;
    }

    .load-notice p {
      margin: 0 0 12px;
      color: #c4cedb;
      font-size: 13px;
      line-height: 1.5;
    }

    .load-actions {
      display: flex;
      gap: 8px;
    }

    .load-actions .secondary-link,
    .load-actions .play-link {
      min-height: 36px;
      padding: 0 12px;
      font-size: 13px;
    }

    body.game-mode {
      overflow: hidden;
      background: #05070a;
    }

    body.game-mode .shell {
      display: none;
    }

    .game-player {
      position: fixed;
      inset: 0;
      background: #05070a;
    }

    .game-frame {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #05070a;
    }

    .return-widget {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2147483647;
      color: #f4f7fb;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      transform: translate3d(var(--return-x, 16px), var(--return-y, 16px), 0);
      transition: transform .26s ease;
      will-change: transform;
    }

    .return-widget.dragging {
      transition: none;
    }

    .return-button {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 8px;
      color: #08100d;
      background: var(--accent);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .36);
      cursor: pointer;
      touch-action: none;
      user-select: none;
      transition: border-color .18s ease, box-shadow .18s ease, opacity .18s ease, transform .18s ease;
    }

    .return-button:hover,
    .return-button:focus-visible {
      outline: none;
      border-color: rgba(255, 255, 255, .42);
      box-shadow: 0 14px 38px rgba(0, 0, 0, .42);
    }

    .return-widget.collapsed .return-button {
      opacity: .78;
    }

    .return-widget.collapsed[data-edge="left"] .return-button,
    .return-widget.collapsed[data-edge="right"] .return-button {
      transform: scaleX(.86);
    }

    .return-widget.collapsed[data-edge="top"] .return-button,
    .return-widget.collapsed[data-edge="bottom"] .return-button {
      transform: scaleY(.86);
    }

    .return-icon {
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
    }

    .return-menu {
      position: absolute;
      top: 60px;
      left: 0;
      width: 188px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      background: rgba(16, 17, 22, .94);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .42);
      backdrop-filter: blur(14px);
    }

    .return-widget[data-menu-x="right"] .return-menu {
      left: auto;
      right: 0;
    }

    .return-widget[data-menu-y="top"] .return-menu {
      top: auto;
      bottom: 60px;
    }

    .return-title {
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }

    .return-current {
      margin-bottom: 10px;
      color: #c4cedb;
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .return-link {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border-radius: 8px;
      color: #08100d;
      background: var(--accent-2);
      font-weight: 800;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 22px, 1180px);
        padding-top: 18px;
      }

      .topbar,
      .section-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav,
      .filters {
        justify-content: flex-start;
      }

      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .hero h2 {
        font-size: clamp(38px, 16vw, 58px);
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .featured {
        min-height: 260px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">G</div>
        <div>
          <h1>DL9998</h1>
          <p>DL9998游戏平台</p>
        </div>
      </div>
      <nav class="nav" aria-label="主导航">
        <!-- <a href="#games">游戏库</a>
        <a href="#featured">推荐</a> -->
      </nav>
    </header>

    <section class="hero" id="featured">
      <div class="hero-copy">
        <div class="eyebrow">daily recommendation</div>
        <h2>今日推荐</h2>
        <div class="hero-actions" id="heroActions"></div>
      </div>
      <article class="featured" id="featuredCard">
        <div class="featured-art" aria-hidden="true"></div>
      </article>
    </section>

    <section id="recentSection" aria-labelledby="recentTitle" hidden>
      <div class="section-head">
        <h2 id="recentTitle">最近玩过</h2>
        <div class="count" id="recentCount"></div>
      </div>
      <div class="recent-grid" id="recentGrid"></div>
    </section>

    <section id="games" aria-labelledby="gamesTitle">
      <div class="toolbar">
        <input class="search" id="searchInput" type="search" placeholder="搜索游戏名称或分类">
        <div class="filters" id="filters"></div>
      </div>

      <div class="section-head">
        <h2 id="gamesTitle">游戏库</h2>
        <div class="count" id="gameCount"></div>
      </div>

      <div class="grid" id="gameGrid"></div>
      <div class="empty" id="emptyState">没有找到匹配的游戏</div>
    </section>
  </main>

  <div class="modal-backdrop" id="detailModal" hidden>
    <article class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div id="detailContent"></div>
    </article>
  </div>

  <script src="./games-config.js"></script>
  <script>
    const games = Array.isArray(window.GAME_CONFIG) ? window.GAME_CONFIG : [];
    const grid = document.querySelector("#gameGrid");
    const filters = document.querySelector("#filters");
    const searchInput = document.querySelector("#searchInput");
    const gameCount = document.querySelector("#gameCount");
    const emptyState = document.querySelector("#emptyState");
    const featuredCard = document.querySelector("#featuredCard");
    const heroActions = document.querySelector("#heroActions");
    const recentSection = document.querySelector("#recentSection");
    const recentGrid = document.querySelector("#recentGrid");
    const recentCount = document.querySelector("#recentCount");
    const detailModal = document.querySelector("#detailModal");
    const detailContent = document.querySelector("#detailContent");
    const allCategory = "全部";
    const favoriteCategory = "我的收藏";
    let activeCategory = allCategory;
    const pageUrl = new URL(window.location.href);
    const launchIndex = Number.parseInt(pageUrl.searchParams.get("game"), 10);
    const launchedGame = Number.isInteger(launchIndex) ? games[launchIndex] : null;
    const recentStorageKey = "dl9998_recent_games";
    const favoriteStorageKey = "dl9998_favorite_games";
    let recentKeys = readStoredList(recentStorageKey);
    let favoriteKeys = new Set(readStoredList(favoriteStorageKey));
    let activeDetailIndex = null;

    function platformUrl() {
      const url = new URL(window.location.href);
      url.search = "";
      url.hash = "";
      return url.toString();
    }

    function launchUrl(index) {
      const url = new URL(window.location.href);
      url.search = "";
      url.hash = "";
      url.searchParams.set("game", String(index));
      return url.toString();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function readStoredList(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(value) ? value.filter(Boolean) : [];
      } catch (error) {
        return [];
      }
    }

    function writeStoredList(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        // Storage can be unavailable in strict privacy modes; the UI still works for this session.
      }
    }

    function gameKey(game) {
      return game ? `${game.name}|${game.url}` : "";
    }

    function gameIndex(game) {
      return games.indexOf(game);
    }

    function gameByKey(key) {
      return games.find((game) => gameKey(game) === key);
    }

    function recentGames() {
      return recentKeys.map(gameByKey).filter(Boolean).slice(0, 4);
    }

    function isFavorite(game) {
      return favoriteKeys.has(gameKey(game));
    }

    function favoriteLabel(game) {
      return isFavorite(game) ? "取消收藏" : "收藏";
    }

    function favoriteGlyph(game) {
      return isFavorite(game) ? "★" : "☆";
    }

    function recordGameLaunch(game) {
      const key = gameKey(game);
      recentKeys = [key, ...recentKeys.filter((item) => item !== key)].slice(0, 8);
      writeStoredList(recentStorageKey, recentKeys);
    }

    function toggleFavorite(game) {
      const key = gameKey(game);
      if (favoriteKeys.has(key)) {
        favoriteKeys.delete(key);
      } else {
        favoriteKeys.add(key);
      }

      writeStoredList(favoriteStorageKey, [...favoriteKeys]);
      renderFeatured();
      renderHeroActions();
      renderRecent();
      renderGames();
      if (activeDetailIndex !== null && !detailModal.hidden) {
        openDetail(activeDetailIndex);
      }
    }

    function renderGamePlayer(game) {
      recordGameLaunch(game);
      document.body.classList.add("game-mode");
      document.body.innerHTML = `
        <section class="game-player" aria-label="${escapeHtml(game.name)}">
          <iframe
            class="game-frame"
            src="${escapeHtml(game.url || "about:blank")}"
            title="${escapeHtml(game.name)}"
            allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
            allowfullscreen>
          </iframe>
          <div class="return-widget" id="returnWidget">
            <button class="return-button" id="returnToggle" type="button" aria-expanded="false" aria-controls="returnMenu" title="返回游戏平台">
              <span class="return-icon" aria-hidden="true">⌂</span>
              <span class="sr-only">返回游戏平台</span>
            </button>
            <div class="return-menu" id="returnMenu" hidden>
              <div class="return-title">DL9998</div>
              <div class="return-current">${escapeHtml(game.name)}</div>
              <a class="return-link" href="${platformUrl()}">返回游戏平台</a>
            </div>
          </div>
          <aside class="load-notice" id="loadNotice" ${game.url ? "hidden" : ""}>
            <h2>游戏可能没有成功打开</h2>
            <p>${game.url ? "如果画面长时间空白，请重试游戏，或返回游戏平台检查游戏地址。" : "这个游戏还没有配置 url，暂时无法打开。"}</p>
            <div class="load-actions">
              <a class="play-link" href="${escapeHtml(window.location.href)}">重试</a>
              <a class="secondary-link" href="${platformUrl()}">返回平台</a>
            </div>
          </aside>
        </section>
      `;

      const returnWidget = document.querySelector("#returnWidget");
      const returnToggle = document.querySelector("#returnToggle");
      const returnMenu = document.querySelector("#returnMenu");
      const gameFrame = document.querySelector(".game-frame");
      const loadNotice = document.querySelector("#loadNotice");
      const iconSize = 50;
      const idleDelay = 5000;
      const visibleWhenCollapsed = 26;
      let position = { x: 16, y: 16 };
      let expandedPosition = { ...position };
      let pointerStart = null;
      let dragStart = null;
      let idleTimer = 0;
      let isDragging = false;
      let wasDragged = false;
      let suppressNextClick = false;

      function viewportBounds() {
        return {
          width: window.innerWidth,
          height: window.innerHeight
        };
      }

      function clampPosition(nextPosition) {
        const bounds = viewportBounds();
        return {
          x: Math.min(Math.max(nextPosition.x, 0), Math.max(bounds.width - iconSize, 0)),
          y: Math.min(Math.max(nextPosition.y, 0), Math.max(bounds.height - iconSize, 0))
        };
      }

      function updateMenuPlacement(nextPosition) {
        const bounds = viewportBounds();
        returnWidget.dataset.menuX = nextPosition.x + 188 > bounds.width - 8 ? "right" : "left";
        returnWidget.dataset.menuY = nextPosition.y > bounds.height / 2 ? "top" : "bottom";
      }

      function setWidgetPosition(nextPosition) {
        position = nextPosition;
        returnWidget.style.setProperty("--return-x", `${Math.round(nextPosition.x)}px`);
        returnWidget.style.setProperty("--return-y", `${Math.round(nextPosition.y)}px`);
        updateMenuPlacement(nextPosition);
      }

      function setMenuOpen(isOpen) {
        returnMenu.hidden = !isOpen;
        returnToggle.setAttribute("aria-expanded", String(isOpen));
      }

      function edgeFor(nextPosition) {
        const bounds = viewportBounds();
        const distances = [
          ["left", nextPosition.x],
          ["right", bounds.width - nextPosition.x - iconSize],
          ["top", nextPosition.y],
          ["bottom", bounds.height - nextPosition.y - iconSize]
        ];

        return distances.sort((a, b) => a[1] - b[1])[0][0];
      }

      function collapseWidget() {
        if (isDragging) return;

        setMenuOpen(false);
        expandedPosition = clampPosition(expandedPosition);
        const bounds = viewportBounds();
        const edge = edgeFor(expandedPosition);
        const nextPosition = { ...expandedPosition };

        if (edge === "left") {
          nextPosition.x = -(iconSize - visibleWhenCollapsed);
        } else if (edge === "right") {
          nextPosition.x = bounds.width - visibleWhenCollapsed;
        } else if (edge === "top") {
          nextPosition.y = -(iconSize - visibleWhenCollapsed);
        } else {
          nextPosition.y = bounds.height - visibleWhenCollapsed;
        }

        returnWidget.dataset.edge = edge;
        returnWidget.classList.add("collapsed");
        setWidgetPosition(nextPosition);
      }

      function expandWidget() {
        if (!returnWidget.classList.contains("collapsed")) return false;

        returnWidget.classList.remove("collapsed");
        setWidgetPosition(clampPosition(expandedPosition));
        return true;
      }

      function resetIdleTimer() {
        window.clearTimeout(idleTimer);
        idleTimer = window.setTimeout(collapseWidget, idleDelay);
      }

      function noteWidgetActivity() {
        expandWidget();
        resetIdleTimer();
      }

      setWidgetPosition(position);
      resetIdleTimer();

      let loadTimer = window.setTimeout(() => {
        loadNotice.hidden = false;
      }, 12000);

      gameFrame.addEventListener("load", () => {
        window.clearTimeout(loadTimer);
      });

      gameFrame.addEventListener("error", () => {
        window.clearTimeout(loadTimer);
        loadNotice.hidden = false;
      });

      returnToggle.addEventListener("click", () => {
        if (suppressNextClick) {
          suppressNextClick = false;
          resetIdleTimer();
          return;
        }

        const isOpen = returnMenu.hidden;
        noteWidgetActivity();
        setMenuOpen(isOpen);
      });

      returnToggle.addEventListener("pointerenter", (event) => {
        if (event.pointerType !== "mouse") return;
        if (expandWidget()) resetIdleTimer();
      });

      returnToggle.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) return;

        if (expandWidget()) {
          suppressNextClick = true;
          resetIdleTimer();
          return;
        }

        isDragging = true;
        wasDragged = false;
        pointerStart = { x: event.clientX, y: event.clientY };
        dragStart = { ...position };
        setMenuOpen(false);
        returnWidget.classList.add("dragging");
        returnToggle.setPointerCapture(event.pointerId);
        window.clearTimeout(idleTimer);
      });

      returnToggle.addEventListener("pointermove", (event) => {
        if (!isDragging || !pointerStart || !dragStart) return;

        const dx = event.clientX - pointerStart.x;
        const dy = event.clientY - pointerStart.y;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) wasDragged = true;

        expandedPosition = clampPosition({
          x: dragStart.x + dx,
          y: dragStart.y + dy
        });
        setWidgetPosition(expandedPosition);
      });

      function endDrag(event) {
        if (!isDragging) return;

        isDragging = false;
        pointerStart = null;
        dragStart = null;
        returnWidget.classList.remove("dragging");

        if (returnToggle.hasPointerCapture(event.pointerId)) {
          returnToggle.releasePointerCapture(event.pointerId);
        }

        if (wasDragged) suppressNextClick = true;
        resetIdleTimer();
      }

      returnToggle.addEventListener("pointerup", endDrag);
      returnToggle.addEventListener("pointercancel", endDrag);

      document.addEventListener("click", (event) => {
        if (event.target.closest(".return-widget")) return;
        setMenuOpen(false);
        resetIdleTimer();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        setMenuOpen(false);
        resetIdleTimer();
      });

      window.addEventListener("resize", () => {
        expandedPosition = clampPosition(expandedPosition);
        if (returnWidget.classList.contains("collapsed")) {
          collapseWidget();
        } else {
          setWidgetPosition(expandedPosition);
        }
      });
    }

    if (launchedGame) {
      renderGamePlayer(launchedGame);
    } else if (pageUrl.searchParams.has("game")) {
      window.location.replace(platformUrl());
    } else {

    function uniqueCategories() {
      return [allCategory, favoriteCategory, ...new Set(games.map((game) => game.category))];
    }

    function renderHeroActions() {
      const latest = recentGames()[0];
      heroActions.innerHTML = latest ? `
        <a class="play-link" href="${launchUrl(gameIndex(latest))}" target="_blank" rel="noopener">继续游戏</a>
        <button class="secondary-link" type="button" data-detail-index="${gameIndex(latest)}">查看上次游戏</button>
      ` : "";
    }

    function renderFeatured() {
      const featured = games.find((game) => game.featured) || games[0];
      if (!featured) {
        featuredCard.innerHTML = "";
        return;
      }

      featuredCard.innerHTML = `
        <div class="featured-art" aria-hidden="true"></div>
        <img class="featured-icon" src="${featured.icon}" alt="${featured.name}">
        <h3>${featured.name}</h3>
        <p>${featured.description || "马上开始游戏。"}</p>
        <div class="recent-actions">
          <a class="play-link" href="${launchUrl(gameIndex(featured))}" target="_blank" rel="noopener">开始游戏</a>
          <button class="icon-button favorite-button ${isFavorite(featured) ? "active" : ""}" type="button" data-favorite-index="${gameIndex(featured)}" title="${favoriteLabel(featured)}">
            <span aria-hidden="true">${favoriteGlyph(featured)}</span>
            <span class="sr-only">${favoriteLabel(featured)}</span>
          </button>
        </div>
      `;
    }

    function renderRecent() {
      const items = recentGames();
      recentSection.hidden = !items.length;
      recentCount.textContent = `${items.length} 款`;
      recentGrid.innerHTML = items.map((game) => `
        <article class="recent-card">
          <img src="${game.icon}" alt="${game.name}">
          <div>
            <div class="meta">
              <span class="tag">${game.category}</span>
              <span class="rating">★ ${game.rating || "4.5"}</span>
            </div>
            <h3>${game.name}</h3>
            <div class="recent-actions">
              <a class="play-link" href="${launchUrl(gameIndex(game))}" target="_blank" rel="noopener">继续</a>
              <button class="icon-button" type="button" data-detail-index="${gameIndex(game)}" title="详情">
                <span aria-hidden="true">i</span>
                <span class="sr-only">详情</span>
              </button>
              <button class="icon-button favorite-button ${isFavorite(game) ? "active" : ""}" type="button" data-favorite-index="${gameIndex(game)}" title="${favoriteLabel(game)}">
                <span aria-hidden="true">${favoriteGlyph(game)}</span>
                <span class="sr-only">${favoriteLabel(game)}</span>
              </button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function renderFilters() {
      filters.innerHTML = uniqueCategories().map((category) => `
        <button class="filter ${category === activeCategory ? "active" : ""}" type="button" data-category="${category}">
          ${category}
        </button>
      `).join("");
    }

    function getVisibleGames() {
      const keyword = searchInput.value.trim().toLowerCase();
      return games.filter((game) => {
        const matchesCategory =
          activeCategory === allCategory ||
          (activeCategory === favoriteCategory && isFavorite(game)) ||
          game.category === activeCategory;
        const matchesKeyword = !keyword ||
          game.name.toLowerCase().includes(keyword) ||
          game.category.toLowerCase().includes(keyword);
        return matchesCategory && matchesKeyword;
      });
    }

    function renderGames() {
      const visibleGames = getVisibleGames();
      gameCount.textContent = `${visibleGames.length} / ${games.length} 款游戏`;
      emptyState.style.display = visibleGames.length ? "none" : "block";
      grid.innerHTML = visibleGames.map((game) => `
        <article class="card">
          <div class="card-media">
            <img src="${game.icon}" alt="${game.name}">
            <button class="icon-button favorite-button ${isFavorite(game) ? "active" : ""}" type="button" data-favorite-index="${gameIndex(game)}" title="${favoriteLabel(game)}">
              <span aria-hidden="true">${favoriteGlyph(game)}</span>
              <span class="sr-only">${favoriteLabel(game)}</span>
            </button>
          </div>
          <div class="card-body">
            <div class="meta">
              <span class="tag">${game.category}</span>
              <span class="rating">★ ${game.rating || "4.5"}</span>
            </div>
            <h3>${game.name}</h3>
            <div class="card-actions">
              <a class="play-link" href="${launchUrl(gameIndex(game))}" target="_blank" rel="noopener">开始游戏</a>
              <button class="icon-button" type="button" data-detail-index="${gameIndex(game)}" title="详情">
                <span aria-hidden="true">i</span>
                <span class="sr-only">详情</span>
              </button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function openDetail(index) {
      const game = games[index];
      if (!game) return;

      activeDetailIndex = index;
      detailContent.innerHTML = `
        <div class="modal-head">
          <img src="${game.icon}" alt="${game.name}">
          <div>
            <h2 id="detailTitle">${game.name}</h2>
            <div class="modal-meta">
              <span>${game.category}</span>
              <span>★ ${game.rating || "4.5"}</span>
              <span>${isFavorite(game) ? "已收藏" : "未收藏"}</span>
            </div>
          </div>
          <button class="icon-button" type="button" data-close-detail title="关闭">
            <span aria-hidden="true">×</span>
            <span class="sr-only">关闭</span>
          </button>
        </div>
        <div class="modal-body">
          <p>${game.description || "马上开始游戏。"}</p>
          <div class="modal-actions">
            <a class="play-link" href="${launchUrl(index)}" target="_blank" rel="noopener">开始游戏</a>
            <button class="secondary-link favorite-button ${isFavorite(game) ? "active" : ""}" type="button" data-favorite-index="${index}">
              ${favoriteGlyph(game)} ${favoriteLabel(game)}
            </button>
          </div>
        </div>
      `;
      detailModal.hidden = false;
    }

    function closeDetail() {
      detailModal.hidden = true;
      activeDetailIndex = null;
    }

    filters.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      activeCategory = button.dataset.category;
      renderFilters();
      renderGames();
    });

    searchInput.addEventListener("input", renderGames);

    document.addEventListener("click", (event) => {
      const favoriteButton = event.target.closest("[data-favorite-index]");
      if (favoriteButton) {
        const game = games[Number(favoriteButton.dataset.favoriteIndex)];
        if (game) toggleFavorite(game);
        return;
      }

      const detailButton = event.target.closest("[data-detail-index]");
      if (detailButton) {
        openDetail(Number(detailButton.dataset.detailIndex));
        return;
      }

      if (event.target.closest("[data-close-detail]") || event.target === detailModal) {
        closeDetail();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !detailModal.hidden) {
        closeDetail();
      }
    });

    renderHeroActions();
    renderFeatured();
    renderRecent();
    renderFilters();
    renderGames();
    }
  </script>
</body>
</html>
